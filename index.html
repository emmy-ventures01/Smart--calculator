<!DOCTYPE html>
<html>
<head>
  <title>Smart Math Solver</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <h2>Smart Math Solver</h2>

  <input id="input" placeholder="Type math e.g. 2+2 or 5×3 or 10÷2">

  <button onclick="solve()">Solve</button>

  <h3 id="result"></h3>
</div>

<script>
function solve() {
  let input = document.getElementById("input").value;
  let result = document.getElementById("result");

  try {
    // Fix symbols
    input = input.replace(/×/g, "*");
    input = input.replace(/÷/g, "/");

    result.innerText = "Answer: " + eval(input);
  } catch {
    result.innerText = "Invalid input";
  }
}
</script>

</body>
</html>
